openapi: 3.0.3
info:
  title: Task Manager API
  version: 1.0.0
  description: Versioned REST API for the Secure Task Manager. Every task operation is scoped to the authenticated user.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
paths:
  /auth/register:
    post:
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        "201": { description: Account created, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        "400": { $ref: '#/components/responses/ValidationError' }
        "409": { $ref: '#/components/responses/Error' }
        "429": { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        "200": { description: Authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Error' }
        "429": { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      summary: Rotate a refresh token
      description: Revokes the presented token and returns a new pair. Presenting an already-rotated token revokes the whole token family.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        "200": { description: New token pair, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        "401": { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      summary: Revoke the refresh-token family
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        "204": { description: Logged out }
  /auth/logout-all:
    post:
      summary: Revoke every refresh token of the current user
      security:
        - bearerAuth: []
      responses:
        "204": { description: All sessions revoked }
        "401": { $ref: '#/components/responses/Error' }
  /tasks:
    get:
      summary: List the current user's tasks
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Current user's paginated tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Task' } }
                  page: { type: integer }
                  limit: { type: integer }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Error' }
    post:
      summary: Create a task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTask' }
      responses:
        "201": { $ref: '#/components/responses/TaskItem' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Error' }
  /tasks/{taskId}:
    parameters:
      - in: path
        name: taskId
        required: true
        schema: { type: string, pattern: '^c[a-z0-9]{20,30}$' }
    get:
      summary: Get one owned task
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: '#/components/responses/TaskItem' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Error' }
        "404": { $ref: '#/components/responses/Error' }
    patch:
      summary: Update one owned task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTask' }
      responses:
        "200": { $ref: '#/components/responses/TaskItem' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Error' }
        "404": { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete one owned task
      security:
        - bearerAuth: []
      responses:
        "204": { description: Deleted }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Error' }
        "404": { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 128 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 128 }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 20, maxLength: 200 }
    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 600 }
    Task:
      type: object
      properties:
        id: { type: string }
        ownerId: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        completed: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateTask:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000, nullable: true }
    UpdateTask:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000, nullable: true }
        completed: { type: boolean }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
  responses:
    Error:
      description: Safe error response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TaskItem:
      description: A single task
      content:
        application/json:
          schema:
            type: object
            properties:
              item: { $ref: '#/components/schemas/Task' }
